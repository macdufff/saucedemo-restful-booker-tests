name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Prepare HTML report for GitHub Pages
        if: always()
        run: touch playwright-report/.nojekyll

      - name: Upload Playwright report artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Upload Pages artifact
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: playwright-report

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: test-results
          retention-days: 7

  publish-report:
    name: Open HTML report
    needs: e2e
    if: always() && github.event_name != 'pull_request' && needs.e2e.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy report to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Link report in job summary
        if: always()
        run: |
          {
            echo "### Playwright HTML report"
            echo ""
            echo "Open: ${{ steps.deploy.outputs.page_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
